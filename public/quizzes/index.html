<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizeditor – Family Quiz</title>
<style>
  :root { --bg:#f1f5f9; --card:#fff; --line:#e2e8f0; --ink:#1e293b; --mut:#64748b; --pri:#4f46e5; --pri2:#4338ca; --bad:#dc2626; --ok:#059669; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; padding:.75rem 1rem; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:1.1rem; margin:0 auto 0 0; }
  #appLogo { width:40px; height:40px; object-fit:contain; border-radius:8px; }
  .logo-field { display:flex; gap:.5rem; align-items:center; }
  .logo-field input { min-width:0; flex:1; }
  .logo-preview { margin:.25rem 0 .75rem; }
  .logo-preview img { width:min(100%, 320px); height:180px; object-fit:contain; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .locmap { margin-top:.5rem; }
  main { display:grid; grid-template-columns:260px 1fr; gap:1rem; padding:1rem; max-width:1100px; margin:0 auto; }
  @media (max-width:760px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:.75rem; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:.4rem .7rem; }
  button:hover:not(:disabled) { background:#f8fafc; }
  button:disabled { opacity:.45; cursor:default; }
  button.pri { background:var(--pri); border-color:var(--pri); color:#fff; font-weight:600; }
  button.pri:hover:not(:disabled) { background:var(--pri2); }
  button.del { color:var(--bad); }
  button.sm { padding:.15rem .45rem; }
  a.btn { display:inline-block; text-decoration:none; font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:.4rem .7rem; }
  input[type=text], input[type=number], input:not([type]), textarea, select { font:inherit; width:100%; padding:.4rem .5rem; border:1px solid #cbd5e1; border-radius:8px; background:#fff; color:inherit; }
  textarea { resize:vertical; }
  label.f { display:block; margin:.4rem 0; }
  label.f > span { display:block; font-size:12px; font-weight:600; color:var(--mut); margin-bottom:2px; }
  .row { display:flex; gap:.4rem; align-items:center; margin:.25rem 0; }
  .row > input[type=checkbox] { width:auto; flex:none; }
  .row > .num { width:5rem; flex:none; }
  .coordinate-entry input { min-width:0; flex:1; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
  .follow-up-grid { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
  .follow-up-grid select { min-width:0; width:100%; padding:.4rem .5rem; border:1px solid #cbd5e1; border-radius:8px; background:#fff; color:inherit; font:inherit; }
  @media (max-width:520px) { .follow-up-grid { grid-template-columns:1fr; } }
  .list button.item { display:block; width:100%; text-align:left; margin:0 0 .3rem; }
  .list button.item.act { border-color:var(--pri); background:#eef2ff; }
  .list small { display:block; color:var(--mut); }
  .question-follow-up { border-left:3px solid var(--ok); margin-left:1rem; }
  .tabs { display:flex; gap:.4rem; margin:.75rem 0 .5rem; }
  .tabs button.act { background:var(--pri); border-color:var(--pri); color:#fff; }
  details { border:1px solid var(--line); border-radius:10px; margin:.4rem 0; background:#fff; }
  details > summary { cursor:pointer; padding:.5rem .7rem; font-weight:600; list-style-position:inside; }
  details > .body { padding:0 .7rem .7rem; }
  .tag { font-size:11px; background:#eef2ff; color:var(--pri2); border-radius:6px; padding:1px 6px; margin-left:.3rem; }
  .mut { color:var(--mut); font-size:12px; }
  .warn { background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:8px; padding:.4rem .6rem; margin:.4rem 0; font-size:12px; }
  .ai-panel { background:linear-gradient(135deg,#eef2ff,#faf5ff); border-color:#c7d2fe; }
  .ai-panel .body { display:grid; gap:.5rem; }
  .ai-help { color:#4338ca; font-size:12px; }
  .language-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:.25rem .5rem; }
  .language-option { display:flex; align-items:center; gap:.35rem; font-size:12px; }
  .language-option input { width:auto; }
  .bar { display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; }
  .grow { flex:1; }
  select.ui-lang { width:auto; }
  #status { position:fixed; left:50%; bottom:1rem; transform:translateX(-50%); background:#0f172a; color:#fff; padding:.5rem 1rem; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; z-index:9; }
  #status.show { opacity:1; }
  code { background:#f1f5f9; padding:0 4px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <img id="appLogo" alt="Family Quiz">
  <h1>📝 Quizeditor</h1>
  <select id="uiLang" class="ui-lang" aria-label="Språk"></select>
  <button id="openDir" class="pri">📂 Öppna mapp…</button>
  <button id="newQuiz">＋ Ny quiz</button>
  <button id="syncMan" title="Bygg om manifest.json från filerna i mappen">🔄 Synka manifest</button>
  <button id="save" class="pri" disabled>💾 Spara</button>
</header>
<main>
  <aside class="panel">
    <div id="where" class="mut"></div>
    <div id="list" class="list"></div>
  </aside>
  <section id="editor" class="panel"></section>
</main>
<div id="status"></div>

<script src="i18n.js"></script>
<script>
'use strict';
const TYPES = { options:'Flerval', text:'Fritext', points:'Poäng', ladder:'Ledtrådsstege' };
const GROUPS = { barnQuestions:'Barn', vuxenQuestions:'Vuxen' };
const FS = 'showDirectoryPicker' in window;
const APP_LOGO = new URL('../Quiz/icon.png', location.href).href;
const S = { dir:null, items:[], manifest:{ list:[], wrap:null }, cur:null, lang:'', group:'barnQuestions', dirty:false, open:new Set(), logoPreview:null };
const $ = id => document.getElementById(id);
const TEXT_ATTRS = new Set(['placeholder', 'title', 'alt', 'aria-label']);

function applyStaticText() {
  document.documentElement.lang = UI_LANG;
  document.title = tr('Quizeditor – Family Quiz');
  document.querySelectorAll('header h1, header button').forEach(node => {
    node.dataset.sv = node.dataset.sv || node.textContent;
    node.textContent = tr(node.dataset.sv);
  });
  const sync = $('syncMan');
  sync.dataset.svTitle = sync.dataset.svTitle || sync.title;
  sync.title = tr(sync.dataset.svTitle);
  const select = $('uiLang');
  select.setAttribute('aria-label', tr('Språk'));
  select.value = UI_LANG;
}

/* ---------- helpers ---------- */
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k in e) e[k] = TEXT_ATTRS.has(k) && typeof v === 'string' ? tr(v) : v;
    else e.setAttribute(k, TEXT_ATTRS.has(k) && typeof v === 'string' ? tr(v) : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(typeof c === 'string' ? tr(c) : c));
  return e;
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '').toLowerCase() || 'quiz';
const isWrapped = raw => !!(raw && raw.quiz && typeof raw.quiz === 'object' && !raw.barnQuestions);
const quizOf = raw => isWrapped(raw) ? raw.quiz : raw;
const fnOf = m => typeof m === 'string' ? m : (m.filename || m.file || '');
const dirUrl = () => location.href.slice(0, location.href.lastIndexOf('/') + 1);
let toastTimer;
function toast(key, ...args) {
  const msg = tr(key, ...args);
  const s = $('status'); s.textContent = msg; s.classList.add('show'); clearTimeout(toastTimer);
  const isError = /^Kunde inte|^Ogiltig|misslyckades/.test(key);
  toastTimer = setTimeout(() => s.classList.remove('show'), isError ? 15000 : 3500);
}
function markDirty() { S.dirty = true; $('save').disabled = false; }
function updateLogoPreview(logoUrl) {
  for (const image of [$('appLogo'), $('quizLogoPreview')].filter(Boolean)) {
    image.alt = logoUrl ? tr('Quizens logotyp') : 'Family Quiz';
    image.onerror = () => {
      if (image.src !== APP_LOGO) image.src = APP_LOGO;
      else image.hidden = true;
    };
    image.hidden = false;
    try {
      image.src = logoUrl
        ? (S.logoPreview && S.logoPreview.name === logoUrl ? S.logoPreview.url : new URL(logoUrl, dirUrl()).href)
        : APP_LOGO;
    }
    catch { image.src = APP_LOGO; }
  }
}
function fileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error(tr('Kunde inte läsa bildfilen')));
    reader.readAsDataURL(file);
  });
}
async function copyLogoToFolder(sourceHandle, file) {
  const dot = file.name.lastIndexOf('.');
  const stem = dot > 0 ? file.name.slice(0, dot) : file.name;
  const extension = dot > 0 ? file.name.slice(dot) : '';
  let name = file.name;
  let suffix = 2;
  while (true) {
    let existing;
    try { existing = await S.dir.getFileHandle(name); }
    catch (e) { if (e.name === 'NotFoundError') break; throw e; }
    if (typeof existing.isSameEntry === 'function' && await existing.isSameEntry(sourceHandle)) {
      return { name, file: await existing.getFile() };
    }
    name = `${stem}_${suffix++}${extension}`;
  }
  const destination = await S.dir.getFileHandle(name, { create: true });
  const writable = await destination.createWritable();
  await writable.write(file);
  await writable.close();
  return { name, file: await destination.getFile() };
}
async function chooseLogo(quiz, logoInput) {
  if (!('showOpenFilePicker' in window)) {
    toast('Webbläsaren saknar filväljare för logotyper – använd Chrome eller Edge');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      multiple: false,
      startIn: S.dir || 'pictures',
      types: [{ description: 'Bildfiler', accept: { 'image/*': ['.png', '.jpg', '.jpeg', '.webp', '.gif', '.svg', '.avif', '.ico'] } }]
    });
    const file = await handle.getFile();
    if (!file.type.startsWith('image/') && !/\.(png|jpe?g|webp|gif|svg|avif|ico)$/i.test(file.name)) {
      throw new Error(tr('Den valda filen är inte en bild'));
    }
    let previewFile = file;
    if (S.dir) {
      const copied = await copyLogoToFolder(handle, file);
      quiz.logoUrl = copied.name;
      previewFile = copied.file;
    } else {
      quiz.logoUrl = await fileAsDataUrl(file);
    }
    logoInput.value = quiz.logoUrl;
    if (S.logoPreview) URL.revokeObjectURL(S.logoPreview.url);
    S.logoPreview = { name: quiz.logoUrl, url: URL.createObjectURL(previewFile) };
    updateLogoPreview(quiz.logoUrl);
    markDirty();
    if (S.dir) toast('Logotyp kopierad till quizmappen: {0} – spara quizet', previewFile.name);
    else toast('Logotyp inbäddad i quizet – spara quizet');
  } catch (e) {
    if (e.name !== 'AbortError') toast('Kunde inte välja logotyp: {0}', e.message);
  }
}

function input(obj, key, o = {}) {
  const e = el(o.area ? 'textarea' : 'input', { type: o.area ? null : (o.type || 'text'), rows: o.area ? 2 : null, placeholder: o.ph || '', step: o.type === 'number' ? 'any' : null, value: obj[key] ?? '' });
  e.addEventListener('input', () => {
    let v = e.value;
    if (o.type === 'number') v = v === '' ? undefined : Number(v);
    else if (o.optional && v === '') v = undefined;
    if (v === undefined) delete obj[key]; else obj[key] = v;
    if (o.after) o.after(v);
    markDirty();
  });
  return e;
}
const field = (label, ctl) => el('label', { class: 'f' }, el('span', {}, label), ctl);

const AI_MODELS = ['gemini-3.8-flash', 'gemini-3.1-flash-lite'];
const AI_KEY_STORAGE = 'bgl_quiz_editor_gemini_api_key';
const QUIZ_LANGUAGES = [
  ['sv', 'Svenska'], ['en', 'Engelska'], ['de', 'Tyska'], ['fr', 'Franska'], ['es', 'Spanska'],
  ['no', 'Norska'], ['da', 'Danska'], ['fi', 'Finska'], ['it', 'Italienska'], ['et', 'Estniska'],
  ['lv', 'Lettiska'], ['lt', 'Litauiska'], ['uk', 'Ukrainska'], ['is', 'Isländska'],
  ['se', 'Nordsamiska'], ['nl', 'Nederländska'], ['be', 'Flamländska']
];

const AI_LANGUAGE_NAMES = {
  sv: 'Swedish', en: 'English', de: 'German', fr: 'French', es: 'Spanish', no: 'Norwegian', da: 'Danish', fi: 'Finnish',
  it: 'Italian', et: 'Estonian', lv: 'Latvian', lt: 'Lithuanian', uk: 'Ukrainian', is: 'Icelandic', se: 'Northern Sami',
  nl: 'Dutch', be: 'Flemish'
};

function aiPrompt(topic, count, target, lang = 'sv') {
  const groups = target === 'barn' ? 'barnQuestions'
    : target === 'vuxen' ? 'vuxenQuestions' : 'barnQuestions and vuxenQuestions';
  if (lang === 'sv') {
    const audience = target === 'barn' ? 'barn i åldern 5–10 år'
      : target === 'vuxen' ? 'vuxna' : 'både barn i åldern 5–10 år och vuxna';
    return `Skapa ett quiz på svenska med temat "${topic}" för ${audience}.
Skapa ${count} frågor per vald målgrupp. Returnera ENDAST giltig JSON utan markdown eller annan text.
JSON-objektet ska innehålla dessa arrayer: ${groups.replace(' and ', ' och ')}.
Varje fråga ska ha "type" och "text". Använd en varierad blandning av följande format:
- options: "options" med 2–4 svarsalternativ och "correctAnswers" som array med 0-baserat index, till exempel [1].
- text: "correctTextAnswer" och gärna "acceptedTextAnswers", samt "options": [].
- points: "maxPoints" och "options": [].
- ladder: exakt tre "clues", "ladderPoints": [10,7,4], "correctTextAnswer" och "options": [].
Använd bara de arrayer som hör till målgrupperna ovan. Skriv alla frågor, svar och ledtrådar på svenska.`;
  }
  const language = AI_LANGUAGE_NAMES[lang] || lang;
  const audience = target === 'barn' ? 'children aged 5–10'
    : target === 'vuxen' ? 'adults' : 'both children aged 5–10 and adults';
  return `Create a quiz in ${language} on the topic "${topic}" for ${audience}.
Create ${count} questions per selected audience. Return ONLY valid JSON without markdown or any other text.
The JSON object must contain these arrays: ${groups} (keep these English key names exactly; barnQuestions = children, vuxenQuestions = adults).
Each question must have "type" and "text". Use a varied mix of the following formats:
- options: "options" with 2–4 answer options and "correctAnswers" as an array of 0-based indexes, for example [1].
- text: "correctTextAnswer" and preferably "acceptedTextAnswers", plus "options": [].
- points: "maxPoints" and "options": [].
- ladder: exactly three "clues", "ladderPoints": [10,7,4], "correctTextAnswer" and "options": [].
Only use the arrays that belong to the audiences above. Write all questions, answers and clues in ${language}.`;
}

function aiJsonFromResponse(response) {
  const text = response.candidates?.[0]?.content?.parts?.map(part => part.text || '').join('').trim();
  if (!text) throw new Error(tr('AI-tjänsten returnerade inget JSON-svar'));
  return parseJson(text.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, ''));
}

async function requestAiQuiz(apiKey, prompt) {
  let lastError;
  for (const model of AI_MODELS) {
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: 'application/json' }
        })
      });
      if (!response.ok) {
        const detail = await response.text();
        throw new Error(tr('Gemini svarade {0}: {1}', response.status, detail.slice(0, 180)));
      }
      return aiJsonFromResponse(await response.json());
    } catch (e) {
      lastError = e;
    }
  }
  throw lastError || new Error(tr('AI-genereringen misslyckades'));
}

async function requestQuizTranslations(apiKey, questions) {
  let lastError;
  for (const model of AI_MODELS) {
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `Translate each quiz question into only the targetLanguages listed for that question. The source language is given as originalLanguage.
Return a JSON object keyed by the exact question id, then by target language code. Each translation must contain text, and translated options/clues arrays when those fields are provided. Keep the options and clues in the same order and preserve quiz facts and answer meaning. Translate correctTextAnswer when it is provided.
Required shape: { "question-id": { "en": { "text": "...", "options": ["..."], "clues": ["..."], "correctTextAnswer": "..." } } }
Do not add explanations or markdown.
Questions JSON:\n${JSON.stringify(questions)}` }] }],
          generationConfig: {
            responseMimeType: 'application/json'
          }
        })
      });
      if (!response.ok) {
        const detail = await response.text();
        throw new Error(tr('Gemini svarade {0}: {1}', response.status, detail.slice(0, 180)));
      }
      const data = aiJsonFromResponse(await response.json());
      if (!data || typeof data !== 'object' || Array.isArray(data)) {
        throw new Error(tr('AI-tjänsten returnerade ett ogiltigt översättningssvar'));
      }
      return data;
    } catch (e) {
      lastError = e;
    }
  }
  throw lastError || new Error(tr('Översättningen misslyckades'));
}

function translationTools() {
  const quiz = quizOf(S.cur.raw);
  const knownLanguages = [...new Set([
    ...quiz.barnQuestions.map(q => q.originalLanguage),
    ...quiz.vuxenQuestions.map(q => q.originalLanguage)
  ].filter(Boolean))];
  const sourceLanguage = knownLanguages.length === 1 ? knownLanguages[0] : 'sv';
  const source = el('select', { id: 'translationSource' },
    ...QUIZ_LANGUAGES.map(([code, name]) => el('option', { value: code, selected: code === sourceLanguage }, name)));
  const targetLanguages = el('div', { id: 'translationLanguages', class: 'language-grid' },
    ...QUIZ_LANGUAGES.filter(([code]) => code !== sourceLanguage).map(([code, name]) =>
      el('label', { class: 'language-option' },
        el('input', { type: 'checkbox', value: code, checked: code === 'en' }),
        name)));
  const chooseAll = () => targetLanguages.querySelectorAll('input[type="checkbox"]').forEach(input => { input.checked = input.value !== source.value; });
  const clearTargets = () => targetLanguages.querySelectorAll('input[type="checkbox"]').forEach(input => { input.checked = false; });
  source.addEventListener('change', () => {
    targetLanguages.querySelectorAll('input[type="checkbox"]').forEach(input => {
      const option = input.closest('label');
      if (input.value === source.value) {
        input.checked = false;
        option.hidden = true;
      } else option.hidden = false;
    });
  });
  return el('details', { class: 'ai-panel' },
    el('summary', {}, '🌐 Skapa språkvarianter av quizet'),
    el('div', { class: 'body' },
      el('div', { class: 'ai-help' }, 'Översättningarna sparas på frågorna i quizfilen och blir tillgängliga som språkval i appen. En befintlig översättning skrivs inte över.'),
      field('Frågornas källspråk (för frågor som saknar språk)', source),
      el('div', { class: 'mut' }, 'Välj ett eller flera språk att översätta till:'),
      targetLanguages,
      el('div', { class: 'bar' },
        el('button', { type: 'button', onclick: chooseAll }, 'Välj alla'),
        el('button', { type: 'button', onclick: clearTargets }, 'Rensa val'),
        el('span', { class: 'grow' }),
        el('button', { id: 'translateQuiz', class: 'pri', onclick: translateQuiz }, '🌐 Översätt quizet'))));
}

async function translateQuiz() {
  if (!S.cur) { toast('Öppna eller skapa ett quiz först'); return; }
  const apiKey = $('aiApiKey').value.trim();
  if (!apiKey) { toast('Ange en Gemini API-nyckel i AI-panelen först'); return; }
  const targetLanguages = [...$('translationLanguages').querySelectorAll('input[type="checkbox"]:checked')].map(input => input.value);
  if (!targetLanguages.length) { toast('Välj minst ett målspråk'); return; }

  const quiz = quizOf(S.cur.raw);
  const questions = [...quiz.barnQuestions, ...quiz.vuxenQuestions];
  if (!questions.length) { toast('Quizet innehåller inga frågor att översätta'); return; }
  const sourceLanguage = $('translationSource').value;
  let languageTagsChanged = false;
  for (const question of questions) {
    if (!question.originalLanguage) {
      question.originalLanguage = sourceLanguage;
      languageTagsChanged = true;
    }
  }
  if (languageTagsChanged) markDirty();
  localStorage.setItem(AI_KEY_STORAGE, apiKey);

  const pending = questions.map(question => ({
    question,
    languages: targetLanguages.filter(language =>
      question.originalLanguage !== language &&
      !(question.translations && question.translations[language] &&
        typeof question.translations[language].text === 'string' &&
        question.translations[language].text.trim()))
  })).filter(item => item.languages.length);
  if (!pending.length) {
    toast('Alla valda språk finns redan för frågorna');
    return;
  }

  const button = $('translateQuiz');
  button.disabled = true;
  let completed = 0;
  let progressLabel = 'Översätter…';
  let progressArgs = [];
  const startedAt = Date.now();
  const tick = () => {
    const secs = Math.floor((Date.now() - startedAt) / 1000);
    button.textContent = `⏳ ${tr(progressLabel, ...progressArgs)} (${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')})`;
  };
  tick();
  const timer = setInterval(tick, 1000);
  try {
    const batchSize = 8;
    for (let start = 0; start < pending.length; start += batchSize) {
      const batch = pending.slice(start, start + batchSize);
      progressLabel = 'Översätter {0} av {1}';
      progressArgs = [Math.min(start + batch.length, pending.length), pending.length];
      tick();
      const request = batch.map(({ question, languages }) => ({
        id: question.id,
        originalLanguage: question.originalLanguage,
        targetLanguages: languages,
        text: question.text,
        ...(Array.isArray(question.options) ? { options: question.options } : {}),
        ...(Array.isArray(question.clues) ? { clues: question.clues } : {}),
        ...(typeof question.correctTextAnswer === 'string' ? { correctTextAnswer: question.correctTextAnswer } : {})
      }));
      const response = await requestQuizTranslations(apiKey, request);
      const updates = [];
      for (const { question, languages } of batch) {
        const questionResult = response[question.id];
        if (!questionResult || typeof questionResult !== 'object') {
          throw new Error(tr('AI-svaret saknar fråga {0}', question.id));
        }
        for (const language of languages) {
          const translation = questionResult[language];
          if (!translation || typeof translation.text !== 'string' || !translation.text.trim()) {
            throw new Error(tr('AI-svaret saknar {0}-översättning för "{1}"', language, question.text.slice(0, 50)));
          }
          if (Array.isArray(question.options) && question.options.length &&
              (!Array.isArray(translation.options) || translation.options.length !== question.options.length)) {
            throw new Error(tr('AI-svaret har fel antal svarsalternativ för {0}-översättningen av "{1}"', language, question.text.slice(0, 50)));
          }
          if (Array.isArray(question.clues) && question.clues.length &&
              (!Array.isArray(translation.clues) || translation.clues.length !== question.clues.length)) {
            throw new Error(tr('AI-svaret har fel antal ledtrådar för {0}-översättningen av "{1}"', language, question.text.slice(0, 50)));
          }
          if (typeof question.correctTextAnswer === 'string' &&
              typeof translation.correctTextAnswer !== 'string') {
            throw new Error(tr('AI-svaret saknar översatt rätt svar för "{0}"', question.text.slice(0, 50)));
          }
          updates.push({ question, language, translation });
        }
      }
      for (const { question, language, translation } of updates) {
        if (!question.translations || typeof question.translations !== 'object' || Array.isArray(question.translations)) {
          question.translations = {};
        }
        question.translations[language] = {
          text: translation.text,
          ...(Array.isArray(translation.options) ? { options: translation.options } : {}),
          ...(Array.isArray(translation.clues) ? { clues: translation.clues } : {}),
          ...(typeof translation.correctTextAnswer === 'string' ? { correctTextAnswer: translation.correctTextAnswer } : {})
        };
      }
      completed += batch.length;
      markDirty();
    }
    toast('{0} språkvarianter skapade för {1} frågor – spara quizet', pending.reduce((total, item) => total + item.languages.length, 0), pending.length);
  } catch (e) {
    const progress = completed ? tr(' ({0} av {1} frågor klara; spara för att behålla dem)', completed, pending.length) : '';
    toast('Kunde inte översätta quizet: {0}', e.message + progress);
  } finally {
    clearInterval(timer);
    button.disabled = false;
    button.textContent = tr('🌐 Översätt quizet');
  }
}

function appendQuestions(raw, language) {
  const source = quizOf(raw);
  if (!source || typeof source !== 'object') throw new Error(tr('Svaret är inte ett quiz-objekt'));
  const quiz = quizOf(S.cur.raw);
  normalize(source);
  let count = 0;
  for (const group of Object.keys(GROUPS)) {
    if (!Array.isArray(source[group])) continue;
    for (const question of source[group]) {
      ensureType(question);
      question.id = uid();
      if (language && !question.originalLanguage) question.originalLanguage = language;
      quiz[group].push(question);
      count++;
    }
  }
  if (!count) throw new Error(tr('JSON innehåller inga barnQuestions eller vuxenQuestions'));
  markDirty();
  renderEditor();
  toast('{0} frågor tillagda i quizet', count);
}

/* ---------- normalisering ---------- */
function ensureType(q) {
  if (q.text == null && q.question != null) { q.text = q.question; delete q.question; }
  q.text = q.text ?? '';
  if (!q.id) q.id = uid();
  if (!TYPES[q.type]) {
    q.type = Array.isArray(q.clues) && q.clues.length ? 'ladder'
      : (typeof q.maxPoints === 'number' && q.maxPoints > 0 && !(q.options || []).length) ? 'points'
      : (typeof q.correctTextAnswer === 'string' && q.correctTextAnswer.trim() && !(q.options || []).length) ? 'text' : 'options';
  }
  if (q.type === 'options') {
    q.options = Array.isArray(q.options) ? q.options.map(String) : ['', '', ''];
    if (!Array.isArray(q.correctAnswers)) q.correctAnswers = [typeof q.correctAnswer === 'number' ? q.correctAnswer : 0];
    delete q.correctAnswer;
  } else if (q.type === 'text') {
    q.correctTextAnswer = q.correctTextAnswer ?? '';
  } else if (q.type === 'points') {
    if (!(q.maxPoints > 0)) q.maxPoints = 10;
  } else if (q.type === 'ladder') {
    q.correctTextAnswer = q.correctTextAnswer ?? '';
    if (!Array.isArray(q.clues) || !q.clues.length) q.clues = ['Ledtråd 1 (svår)', 'Ledtråd 2 (medel)', 'Ledtråd 3 (lätt)'];
    if (!Array.isArray(q.ladderPoints) || !q.ladderPoints.length) q.ladderPoints = [10, 7, 4];
  }
  return q;
}
function normalize(raw) {
  const quiz = quizOf(raw);
  for (const g of Object.keys(GROUPS)) { if (!Array.isArray(quiz[g])) quiz[g] = []; quiz[g].forEach(ensureType); }
}
const newQuestion = () => ensureType({ type: 'options', text: '', options: ['', '', ''], correctAnswers: [0] });

/* ---------- lista och inläsning ---------- */
const looksLikeQuiz = raw => { const q = quizOf(raw); return q && typeof q === 'object' && (Array.isArray(q.barnQuestions) || Array.isArray(q.vuxenQuestions)); };
const parseJson = text => JSON.parse(text.replace(/^\uFEFF/, ''));
const itemOf = (filename, raw) => { const q = quizOf(raw); return { filename, title: q.title || filename, barn: (q.barnQuestions || []).length, vuxen: (q.vuxenQuestions || []).length }; };
function setManifest(data) {
  S.manifest = Array.isArray(data) ? { list: data, wrap: null } : (data && Array.isArray(data.quizzes) ? { list: data.quizzes, wrap: data } : { list: [], wrap: null });
}

async function readDirFile(name) { return (await (await S.dir.getFileHandle(name)).getFile()).text(); }
async function writeDirFile(name, text) {
  const w = await (await S.dir.getFileHandle(name, { create: true })).createWritable();
  await w.write(new Blob([text], { type: 'application/json' }));
  await w.close();
}

async function loadFolder() {
  S.items = [];
  try { setManifest(parseJson(await readDirFile('manifest.json'))); } catch { setManifest(null); }
  const names = [];
  for await (const h of S.dir.values()) if (h.kind === 'file' && /\.json$/i.test(h.name) && h.name !== 'manifest.json') names.push(h.name);
  names.sort((a, b) => a.localeCompare(b, 'sv'));
  for (const name of names) {
    try { const raw = parseJson(await readDirFile(name)); if (looksLikeQuiz(raw)) S.items.push(itemOf(name, raw)); } catch { /* inte en quizfil */ }
  }
}

async function loadHttp() {
  S.items = [];
  let files = [];
  try {
    const r = await fetch('files.php?_t=' + Date.now());
    if (r.ok) { const d = await r.json(); if (Array.isArray(d)) files = d.filter(f => typeof f === 'string' && /\.json$/i.test(f) && f !== 'manifest.json' && !f.includes('/')); }
  } catch { /* ingen PHP */ }
  try { const r = await fetch('manifest.json?_t=' + Date.now()); if (r.ok) setManifest(await r.json()); } catch { setManifest(null); }
  if (!files.length) files = S.manifest.list.map(fnOf).filter(Boolean);
  for (const f of files) {
    const m = S.manifest.list.find(x => fnOf(x) === f) || {};
    S.items.push({ filename: f, title: m.title || f, barn: m.barnCount ?? '?', vuxen: m.vuxenCount ?? '?' });
  }
}

async function refresh() {
  if (S.dir) await loadFolder();
  else if (location.protocol !== 'file:') await loadHttp();
  renderList();
}

async function openQuiz(filename) {
  if (S.dirty && !confirm(tr('Du har osparade ändringar. Fortsätta ändå?'))) return;
  try {
    const text = S.dir ? await readDirFile(filename) : await (await fetch(filename + '?_t=' + Date.now())).text();
    const raw = parseJson(text);
    if (!looksLikeQuiz(raw)) throw new Error(tr('Filen ser inte ut som en quiz'));
    normalize(raw);
    S.cur = { filename, raw, isNew: false };
    S.dirty = false; $('save').disabled = true;
    renderList(); renderEditor();
  } catch (e) { toast('Kunde inte öppna {0}: {1}', filename, e.message); }
}

function languageSwitcher(quiz) {
  const codes = new Set();
  for (const q of [...quiz.barnQuestions, ...quiz.vuxenQuestions]) {
    codes.add(q.originalLanguage || 'sv');
    Object.keys(q.translations || {}).forEach(code => codes.add(code));
  }
  if (S.lang) codes.add(S.lang);
  const name = code => tr((QUIZ_LANGUAGES.find(([c]) => c === code) || [code, code])[1]);
  const bar = el('div', { class: 'tabs' }, el('span', { class: 'mut' }, 'Visa/redigera språk:'),
    el('button', { class: S.lang ? '' : 'act', onclick: () => { S.lang = ''; renderEditor(); } }, 'Original'));
  for (const code of codes) {
    bar.append(el('button', { class: S.lang === code ? 'act' : '', onclick: () => { S.lang = code; renderEditor(); } }, name(code)));
  }
  return bar;
}

function questionRows(list) {
  const questionsById = new Map(list.map(q => [q.id, q]));
  const followUpTargetIds = new Set(
    list.map(q => q.followUpQuestionId).filter(id => questionsById.has(id))
  );
  const rows = [];
  const rendered = new Set();

  const appendGroup = (question, number, depth, ancestors) => {
    if (rendered.has(question.id) || ancestors.has(question.id)) return;
    rendered.add(question.id);
    rows.push({ index: list.indexOf(question), number, depth, isFollowUp: depth > 0 });

    const nextAncestors = new Set(ancestors);
    nextAncestors.add(question.id);
    const child = questionsById.get(question.followUpQuestionId);
    if (child) appendGroup(child, `${number}.1`, depth + 1, nextAncestors);
  };

  list.forEach((question, index) => {
    if (!followUpTargetIds.has(question.id)) appendGroup(question, String(index + 1), 0, new Set());
  });

  // Keep malformed links and cycles visible rather than silently hiding questions.
  list.forEach((question, index) => {
    if (!rendered.has(question.id)) appendGroup(question, String(index + 1), 0, new Set());
  });
  return rows;
}

function questionCard(list, i, row = { number: String(i + 1), depth: 0, isFollowUp: false }) {
  const q = list[i];
  const lang = S.lang && S.lang !== (q.originalLanguage || 'sv') ? S.lang : '';
  const label = () => {
    const shown = lang ? (q.translations?.[lang]?.text || q.text) : q.text;
    return `${row.number}. ${row.isFollowUp ? tr('↳ Följdfråga: ') : ''}${(shown || tr('(ingen text)')).slice(0, 70)}`;
  };
  const sum = el('summary', {}, label(), el('span', { class: 'tag' }, TYPES[q.type]));
  const d = el('details', {
    class: row.isFollowUp ? 'question-follow-up' : '',
    open: S.open.has(q.id),
    ontoggle: e => { e.target.open ? S.open.add(q.id) : S.open.delete(q.id); }
  }, sum);
  const body = el('div', { class: 'body' });
  const retag = () => sum.firstChild.textContent = label();

  if (lang) {
    body.append(translationEditor(q, lang, retag));
    d.append(body);
    return d;
  }

  const sel = el('select', {}, ...Object.entries(TYPES).map(([v, t]) => el('option', { value: v, selected: q.type === v }, t)));
  sel.addEventListener('change', () => { q.type = sel.value; ensureType(q); markDirty(); S.open.add(q.id); renderEditor(); });
  body.append(el('div', { class: 'grid2' }, field('Frågetyp', sel), field('Bild (URL eller filnamn)', input(q, 'imageUrl', { optional: true }))));
  body.append(field('Frågetext', input(q, 'text', { area: true, after: retag })));

  if (q.type === 'options') body.append(optionsEditor(q));
  if (q.type === 'text' || q.type === 'ladder') {
    body.append(field('Rätt svar', input(q, 'correctTextAnswer')));
    const acc = el('input', { type: 'text', placeholder: 'Alternativa svar, kommaseparerade', value: (q.acceptedTextAnswers || []).join(', ') });
    acc.addEventListener('input', () => { const a = acc.value.split(',').map(s => s.trim()).filter(Boolean); if (a.length) q.acceptedTextAnswers = a; else delete q.acceptedTextAnswers; markDirty(); });
    body.append(field('Godkända alternativ', acc));
  }
  if (q.type === 'points') body.append(field('Maxpoäng', input(q, 'maxPoints', { type: 'number' })));
  if (q.type === 'ladder') body.append(cluesEditor(q));

  const latIn = locInput(q, 'lat', true), lngIn = locInput(q, 'lng', true), nameIn = locInput(q, 'name', false);
  const coordinatesIn = el('input', {
    type: 'text',
    placeholder: 't.ex. [56,2432187, 12,8614824] eller OpenStreetMap-länk',
    'aria-label': 'Klistra in koordinater eller OpenStreetMap-länk'
  });
  const useCoordinates = () => {
    const coordinates = parseCoordinates(coordinatesIn.value);
    if (!coordinates) { toast('Ogiltigt koordinatformat eller koordinater utanför tillåtna gränser'); return; }
    latIn.value = coordinates.lat;
    lngIn.value = coordinates.lng;
    latIn.dispatchEvent(new Event('input', { bubbles: true }));
    lngIn.dispatchEvent(new Event('input', { bubbles: true }));
    coordinatesIn.value = '';
    toast('Koordinater tillagda');
  };
  coordinatesIn.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); useCoordinates(); }
  });
  const coordinatesButton = el('button', { type: 'button', class: 'pri', onclick: useCoordinates }, 'Använd');
  const followUpQuestion = el('select', {},
    el('option', { value: '' }, 'Ingen följdfråga'),
    ...list.filter(item => item.id !== q.id).map(item =>
      el('option', { value: item.id, selected: q.followUpQuestionId === item.id }, item.text || item.id)));
  followUpQuestion.value = q.followUpQuestionId || '';
  followUpQuestion.addEventListener('change', () => {
    if (followUpQuestion.value) {
      q.followUpQuestionId = followUpQuestion.value;
      q.followUpMode = q.followUpMode || 'always';
    } else {
      delete q.followUpQuestionId;
      delete q.followUpMode;
    }
    followUpMode.disabled = !q.followUpQuestionId;
    markDirty();
  });
  const followUpMode = el('select', { disabled: !q.followUpQuestionId },
    ...[
      ['always', 'Alltid'],
      ['correct', 'Endast vid rätt svar'],
      ['incorrect', 'Endast vid fel svar']
    ].map(([value, label]) => el('option', { value, selected: (q.followUpMode || 'always') === value }, label)));
  followUpMode.value = q.followUpMode || 'always';
  followUpMode.addEventListener('change', () => {
    q.followUpMode = followUpMode.value;
    markDirty();
  });
  const mapBox = el('div', { class: 'locmap' });
  const loc = el('details', { ontoggle: e => { if (e.target.open) initLocationLink(mapBox, latIn, lngIn); } },
    el('summary', {}, 'Plats (valfritt)'),
    el('div', { class: 'body' },
      field('Klistra in koordinater', el('div', { class: 'row coordinate-entry' }, coordinatesIn, coordinatesButton)),
      el('div', { class: 'grid2' }, field('Latitud', latIn), field('Longitud', lngIn), field('Platsnamn', nameIn)),
      mapBox,
      el('section', { class: 'follow-up' },
        el('h3', {}, 'Följdfråga'),
        el('p', { class: 'mut' }, 'Välj en fråga som ska visas efter den här frågan och när den ska visas.'),
        el('div', { class: 'follow-up-grid' },
          field('Fråga', followUpQuestion),
          field('Villkor', followUpMode)))));
  if (q.location || q.followUpQuestionId) loc.open = true;
  body.append(loc);

  if (q.translations && Object.keys(q.translations).length) {
    body.append(el('div', { class: 'warn' }, tr('Har översättningar ({0}) som inte uppdateras när du ändrar texten. ', Object.keys(q.translations).join(', ')),
      el('button', { class: 'sm', onclick: () => { delete q.translations; markDirty(); renderEditor(); } }, 'Ta bort översättningar')));
  }

  const move = (to) => { if (to < 0 || to >= list.length) return; list.splice(to, 0, list.splice(i, 1)[0]); markDirty(); renderEditor(); };
  body.append(el('div', { class: 'bar', style: 'margin-top:.5rem' },
    el('button', { class: 'sm', onclick: () => move(i - 1) }, '↑'), el('button', { class: 'sm', onclick: () => move(i + 1) }, '↓'),
    el('button', { class: 'sm', onclick: () => { const c = JSON.parse(JSON.stringify(q)); c.id = uid(); list.splice(i + 1, 0, c); S.open.add(c.id); markDirty(); renderEditor(); } }, 'Duplicera'),
    el('button', { class: 'sm del', onclick: () => { if (confirm(tr('Ta bort frågan?'))) { list.splice(i, 1); markDirty(); renderEditor(); } } }, 'Ta bort')));
  d.append(body);
  return d;
}

function translationEditor(q, lang, retag) {
  const box = el('div');
  const ensure = () => {
    if (!q.translations || typeof q.translations !== 'object' || Array.isArray(q.translations)) q.translations = {};
    return q.translations[lang] || (q.translations[lang] = {});
  };
  const view = new Proxy({}, {
    get: (_, key) => q.translations?.[lang]?.[key],
    set: (_, key, value) => { ensure()[key] = value; return true; },
    deleteProperty: (_, key) => { if (q.translations?.[lang]) delete q.translations[lang][key]; return true; }
  });
  const langName = tr((QUIZ_LANGUAGES.find(([code]) => code === lang) || [lang, lang])[1]);
  box.append(el('div', { class: 'mut' }, tr('Redigerar {0}. Originaltext: {1} – typ, rätt svar och plats ändras i originalspråket.', langName, q.text || tr('(ingen)'))));
  box.append(field('Frågetext', input(view, 'text', { area: true, after: retag })));

  const listEditor = (key, title, original) => {
    const rows = el('div');
    original.forEach((orig, r) => {
      const txt = el('input', { type: 'text', value: q.translations?.[lang]?.[key]?.[r] ?? '', placeholder: orig });
      txt.addEventListener('input', () => {
        const t = ensure();
        if (!Array.isArray(t[key])) t[key] = original.map(() => '');
        t[key][r] = txt.value;
        markDirty();
      });
      rows.append(el('div', { class: 'row' }, txt));
    });
    box.append(el('div', {}, el('div', { class: 'mut' }, title), rows));
  };
  if (q.type === 'options' && Array.isArray(q.options)) listEditor('options', 'Svarsalternativ', q.options);
  if (q.type === 'ladder' && Array.isArray(q.clues)) listEditor('clues', 'Ledtrådar', q.clues);
  if ((q.type === 'text' || q.type === 'ladder') && typeof q.correctTextAnswer === 'string') {
    box.append(field('Rätt svar', Object.assign(input(view, 'correctTextAnswer'), { placeholder: q.correctTextAnswer })));
  }
  return box;
}

function optionsEditor(q) {
  const box = el('div', {}, el('div', { class: 'mut' }, 'Bocka i rätt svar (flera går bra).'));
  const rows = el('div');
  const draw = () => {
    rows.replaceChildren();
    q.options.forEach((o, r) => {
      const chk = el('input', { type: 'checkbox', title: 'Rätt svar', checked: q.correctAnswers.includes(r) });
      chk.addEventListener('change', () => { q.correctAnswers = chk.checked ? [...new Set([...q.correctAnswers, r])].sort() : q.correctAnswers.filter(x => x !== r); markDirty(); });
      const txt = el('input', { type: 'text', value: o, placeholder: tr('Svarsalternativ {0}', r + 1) });
      txt.addEventListener('input', () => { q.options[r] = txt.value; markDirty(); });
      const rm = el('button', { class: 'sm del', title: 'Ta bort', onclick: () => {
        q.options.splice(r, 1);
        q.correctAnswers = q.correctAnswers.filter(x => x !== r).map(x => x > r ? x - 1 : x);
        if (q.optionImages) q.optionImages.splice(r, 1);
        for (const t of Object.values(q.translations || {})) if (Array.isArray(t.options)) t.options.splice(r, 1);
        markDirty(); draw();
      } }, '✕');
      rows.append(el('div', { class: 'row' }, chk, txt, rm));
    });
  };
  draw();
  box.append(rows, el('button', { class: 'sm', onclick: () => {
    q.options.push('');
    if (q.optionImages) q.optionImages.push('');
    for (const t of Object.values(q.translations || {})) if (Array.isArray(t.options)) t.options.push('');
    markDirty(); draw();
  } }, '＋ Svarsalternativ'));
  return box;
}

function cluesEditor(q) {
  const box = el('div', {}, el('div', { class: 'mut' }, 'Ledtrådar från svårast till lättast, med poäng per steg.'));
  const rows = el('div');
  const draw = () => {
    rows.replaceChildren();
    q.clues.forEach((cl, r) => {
      const txt = el('input', { type: 'text', value: cl });
      txt.addEventListener('input', () => { q.clues[r] = txt.value; markDirty(); });
      const pts = el('input', { type: 'number', class: 'num', value: q.ladderPoints[r] ?? 0, title: 'Poäng' });
      pts.addEventListener('input', () => { q.ladderPoints[r] = Number(pts.value) || 0; markDirty(); });
      rows.append(el('div', { class: 'row' }, txt, pts, el('button', { class: 'sm del', onclick: () => { q.clues.splice(r, 1); q.ladderPoints.splice(r, 1); markDirty(); draw(); } }, '✕')));
    });
  };
  draw();
  box.append(rows, el('button', { class: 'sm', onclick: () => { q.clues.push(''); q.ladderPoints.push(1); markDirty(); draw(); } }, '＋ Ledtråd'));
  return box;
}

function initLocationLink(box, latIn, lngIn) {
  if (box.dataset.ready) return;
  box.dataset.ready = '1';
  const link = el('a', { class: 'btn', target: '_blank', rel: 'noopener noreferrer' }, '📍 Visa position i OpenStreetMap');
  const hint = el('div', { class: 'mut' });
  const updateLink = () => {
    const la = parseFloat(latIn.value), ln = parseFloat(lngIn.value);
    const valid = Number.isFinite(la) && Number.isFinite(ln) && la >= -90 && la <= 90 && ln >= -180 && ln <= 180;
    link.hidden = !valid;
    if (valid) {
      link.href = `https://www.openstreetmap.org/?mlat=${encodeURIComponent(la)}&mlon=${encodeURIComponent(ln)}#map=15/${la}/${ln}`;
      hint.textContent = tr('Öppnas i OpenStreetMaps egen kartvy.');
    } else {
      hint.textContent = tr('Fyll i giltig latitud och longitud för att visa positionen på kartan.');
    }
  };
  latIn.addEventListener('input', updateLink);
  lngIn.addEventListener('input', updateLink);
  updateLink();
  box.append(link, hint);
}

function locInput(q, key, num) {
  const e = el('input', { type: num ? 'number' : 'text', step: num ? 'any' : null, value: q.location?.[key] ?? '' });
  e.addEventListener('input', () => {
    const loc = q.location || {};
    const v = e.value.trim();
    if (v === '') delete loc[key]; else loc[key] = num ? Number(v) : v;
    if (loc.lat === undefined && loc.lng === undefined && !loc.name) delete q.location; else q.location = loc;
    markDirty();
  });
  return e;
}

function parseCoordinates(input) {
  const text = String(input || '').trim();
  if (!text) return null;
  const patterns = [
    /[?&]mlat=(-?\d+(?:\.\d+)?)[^#]*[?&]mlon=(-?\d+(?:\.\d+)?)/i,
    /[?&]mlon=(-?\d+(?:\.\d+)?)[^#]*[?&]mlat=(-?\d+(?:\.\d+)?)/i,
    /#map=\d+\/(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)/i,
    /@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/,
  ];
  for (const pattern of patterns) {
    const match = text.match(pattern);
    if (match) {
      const coordinates = validCoordinates(Number(match[1]), Number(match[2]));
      if (coordinates) return coordinates;
    }
  }

  const cleaned = text.replace(/[\[\]()]/g, '').trim();
  const decimalComma = cleaned.match(/^\s*(-?\d+),(\d+)\s*,\s*(-?\d+),(\d+)\s*$/);
  if (decimalComma) {
    const coordinates = validCoordinates(
      Number(`${decimalComma[1]}.${decimalComma[2]}`),
      Number(`${decimalComma[3]}.${decimalComma[4]}`)
    );
    if (coordinates) return coordinates;
  }

  const decimalPoint = cleaned.match(/^\s*(-?\d+\.\d+)\s*(?:,|;|\/|\s)\s*(-?\d+\.\d+)\s*$/);
  if (decimalPoint) return validCoordinates(Number(decimalPoint[1]), Number(decimalPoint[2]));

  const separated = cleaned.match(/^\s*(-?\d+(?:[.,]\d+)?)\s*(?:;|\/|\s+)\s*(-?\d+(?:[.,]\d+)?)\s*$/);
  if (separated) {
    return validCoordinates(
      Number(separated[1].replace(',', '.')),
      Number(separated[2].replace(',', '.'))
    );
  }
  return null;
}

function validCoordinates(lat, lng) {
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
  if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
  return { lat, lng };
}

/* ---------- manifest ---------- */
function metaFor(filename, raw) {
  const quiz = quizOf(raw);
  const old = S.manifest.list.find(m => fnOf(m) === filename) || {};
  return {
    ...old,
    id: old.id || slug(filename.replace(/\.json$/i, '')).replace(/_/g, '-'),
    title: quiz.title || filename,
    description: quiz.description ?? old.description ?? '',
    filename,
    barnCount: quiz.barnQuestions.length,
    vuxenCount: quiz.vuxenQuestions.length,
    language: old.language || quiz.barnQuestions[0]?.originalLanguage || quiz.vuxenQuestions[0]?.originalLanguage || 'sv'
  };
}
function putManifestEntry(entry) {
  const i = S.manifest.list.findIndex(m => fnOf(m) === entry.filename);
  if (i >= 0) S.manifest.list[i] = entry; else S.manifest.list.push(entry);
}
const manifestText = () => JSON.stringify(S.manifest.wrap ? { ...S.manifest.wrap, quizzes: S.manifest.list } : S.manifest.list, null, 2) + '\n';
function download(name, text) {
  const a = el('a', { href: URL.createObjectURL(new Blob([text], { type: 'application/json' })), download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ---------- åtgärder ---------- */
async function ensureSaveDir() {
  if (S.dir || !FS) return;
  try {
    const saved = await readSavedDirectory();
    if (saved && (await saved.requestPermission({ mode: 'readwrite' })) === 'granted') S.dir = saved;
  } catch { /* använd nedladdning */ }
}

async function save() {
  const c = S.cur; if (!c) return;
  const quiz = quizOf(c.raw);
  if (!String(quiz.title || '').trim()) { toast('Titel saknas'); return; }
  await ensureSaveDir();
  if (isWrapped(c.raw)) { c.raw.quizConfig = { ...c.raw.quizConfig, ...JSON.parse(JSON.stringify(quiz)) }; c.raw.exportedAt = new Date().toISOString(); }
  const text = JSON.stringify(c.raw, null, 2) + '\n';
  putManifestEntry(metaFor(c.filename, c.raw));
  try {
    if (S.dir) {
      await writeDirFile(c.filename, text);
      await writeDirFile('manifest.json', manifestText());
      toast('Sparat i mappen (inkl. manifest.json)');
    } else {
      download(c.filename, text);
      setTimeout(() => download('manifest.json', manifestText()), 500);
      toast('Filer nedladdade – ladda upp dem till din sajt');
    }
  } catch (e) { toast('Kunde inte spara: {0}', e.message); return; }
  c.isNew = false; S.dirty = false; $('save').disabled = true;
  const it = itemOf(c.filename, c.raw); const i = S.items.findIndex(x => x.filename === c.filename);
  if (i >= 0) S.items[i] = it; else S.items.push(it);
  renderList(); renderEditor();
}

function newQuiz() {
  if (S.dirty && !confirm(tr('Du har osparade ändringar. Fortsätta ändå?'))) return;
  const title = (prompt(tr('Titel på nya quizet:')) || '').trim();
  if (!title) return;
  let filename = slug(title) + '.json', n = 2;
  while (S.items.some(i => i.filename === filename)) filename = `${slug(title)}_${n++}.json`;
  const raw = { title, description: '', timeLimit: 0, barnQuestions: [newQuestion()], vuxenQuestions: [newQuestion()] };
  S.cur = { filename, raw, isNew: true };
  S.items.push({ ...itemOf(filename, raw), isNew: true });
  S.group = 'barnQuestions'; S.open.add(raw.barnQuestions[0].id);
  markDirty(); renderList(); renderEditor();
}

async function deleteQuiz() {
  const c = S.cur;
  if (!c) return;
  if (c.isNew) {
    if (!confirm(tr('Ta bort {0} från mappen?', c.filename))) return;
    S.items = S.items.filter(i => i.filename !== c.filename);
    S.cur = null; S.dirty = false; $('save').disabled = true;
    renderList(); renderEditor(); toast('Borttagen');
    return;
  }
  await ensureSaveDir();
  if (!S.dir) { toast('Öppna quizmappen med "Öppna mapp…" för att kunna ta bort quiz'); return; }
  if (!confirm(tr('Ta bort {0} från mappen?', c.filename))) return;
  try {
    try { setManifest(parseJson(await readDirFile('manifest.json'))); } catch { /* behåll aktuell */ }
    await S.dir.removeEntry(c.filename);
    S.manifest.list = S.manifest.list.filter(m => fnOf(m) !== c.filename);
    await writeDirFile('manifest.json', manifestText());
  } catch (e) { toast('Kunde inte ta bort: {0}', e.message); return; }
  S.cur = null; S.dirty = false; $('save').disabled = true;
  await refresh(); renderEditor(); toast('Borttagen');
}

async function syncManifest() {
  if (!S.dir) return;
  const list = [];
  for (const it of S.items.filter(i => !i.isNew)) {
    try { const raw = parseJson(await readDirFile(it.filename)); normalize(raw); list.push(metaFor(it.filename, raw)); } catch { /* hoppa över */ }
  }
  S.manifest.list = list;
  try { await writeDirFile('manifest.json', manifestText());   toast('manifest.json uppdaterad ({0} quiz)', list.length); }
    catch (e) { toast('Kunde inte skriva manifest.json: {0}', e.message); }
}

async function openDir() {
  if (!FS) { toast('Webbläsaren saknar mappåtkomst – använd Chrome eller Edge'); return; }
  let savedDir = null;
  try { savedDir = await readSavedDirectory(); }
  catch (e) { toast('Kunde inte läsa sparad mapp: {0}', e.message); }

  let selectedDir;
  try {
    // Visa alltid mappväljaren så att användaren kan kontrollera eller byta mapp.
    selectedDir = await window.showDirectoryPicker({ mode: 'readwrite', ...(savedDir ? { startIn: savedDir } : {}) });
  } catch (e) {
    if (e.name !== 'AbortError') toast('Kunde inte öppna mapp: {0}', e.message);
    return;
  }
  S.dir = selectedDir;
  try { await saveDirectory(S.dir); }
  catch (e) { toast('Mappen öppnades men kunde inte kommas ihåg: {0}', e.message); }
  S.cur = null; S.dirty = false; $('save').disabled = true;
  await refresh(); renderEditor();
}

function directoryStore(mode, operation) {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB stöds inte')); return; }
    const request = indexedDB.open('bgl-quiz-editor', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('settings');
    request.onerror = () => reject(request.error || new Error('Kunde inte öppna lokal lagring'));
    request.onsuccess = () => {
      const db = request.result;
      const tx = db.transaction('settings', mode);
      const query = operation(tx.objectStore('settings'));
      let result;
      query.onsuccess = () => { result = query.result; };
      query.onerror = () => reject(query.error || new Error('Kunde inte använda lokal lagring'));
      tx.oncomplete = () => { db.close(); resolve(result); };
      tx.onerror = () => { db.close(); reject(tx.error || new Error('Kunde inte spara lokal lagring')); };
      tx.onabort = () => { db.close(); reject(tx.error || new Error('Lokal lagring avbröts')); };
    };
  });
}
const readSavedDirectory = () => directoryStore('readonly', store => store.get('lastDirectory'));
const saveDirectory = handle => directoryStore('readwrite', store => store.put(handle, 'lastDirectory'));

/* ---------- start ---------- */
$('openDir').onclick = openDir;
$('newQuiz').onclick = newQuiz;
$('save').onclick = save;
$('syncMan').onclick = syncManifest;
{
  const select = $('uiLang');
  LANGUAGES.forEach(l => select.append(el('option', { value: l.code }, `${l.flag} ${l.label}`)));
  select.addEventListener('change', () => {
    setUiLang(select.value);
    applyStaticText();
    renderList(); renderEditor();
  });
  applyStaticText();
}
$('openDir').hidden = !FS;
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (!$('save').disabled) save(); } });
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
(async () => {
  await refresh();
  renderEditor();
})().catch(e => {
  toast('Kunde inte läsa quizmappen: {0}', e.message);
  renderList(); renderEditor();
});
</script>
